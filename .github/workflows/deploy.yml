name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Challenge-Tracker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro application
        run: npm run build

      - name: Verify build artifact
        run: |
          if [ -d "dist" ]; then
            echo "Build successful. Dist directory verified."
          else
            echo "Build failed: dist directory not found."
            exit 1
          fi
